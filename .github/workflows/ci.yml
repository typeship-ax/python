name: SDK quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python SDK · typecheck, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check build pyright twine
      - name: Compile and typecheck
        run: |
          python -m compileall -q typeship
          pyright typeship
      - name: Build and inspect the distribution
        run: |
          python -m build
          python -m twine check dist/*
